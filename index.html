<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人生挂机游戏</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <svg aria-hidden="true" class="icon-defs">
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"></path>
      </symbol>
      <symbol id="i-fast" viewBox="0 0 24 24">
        <path d="M4 6l7 6-7 6V6zm8 0l8 6-8 6V6z"></path>
      </symbol>
      <symbol id="i-save" viewBox="0 0 24 24">
        <path d="M5 3h12l2 2v16H5V3zm3 2v6h8V5H8zm0 10v4h8v-4H8z"></path>
      </symbol>
      <symbol id="i-reset" viewBox="0 0 24 24">
        <path d="M12 5a7 7 0 1 1-6.1 3.6H3l4-4 4 4H8.4A5 5 0 1 0 12 7V5z"></path>
      </symbol>
      <symbol id="i-skill" viewBox="0 0 24 24">
        <path d="M12 2l3 7h7l-5.5 4.5 2 7L12 16l-6.5 4.5 2-7L2 9h7l3-7z"></path>
      </symbol>
      <symbol id="i-event" viewBox="0 0 24 24">
        <path d="M12 2l9 5v10l-9 5-9-5V7l9-5zm0 3.2L6 8.5v7l6 3.3 6-3.3v-7l-6-3.3z"></path>
      </symbol>
      <symbol id="i-social" viewBox="0 0 24 24">
        <path d="M8 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm8.5 1a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zM2 21a6 6 0 0 1 12 0H2zm10.8 0a7.7 7.7 0 0 0-2.1-5.3A5.5 5.5 0 0 1 22 18.5V21h-9.2z"></path>
      </symbol>
      <symbol id="i-bag" viewBox="0 0 24 24">
        <path d="M8 7V5a4 4 0 0 1 8 0v2h4v15H4V7h4zm2 0h4V5a2 2 0 0 0-4 0v2zm-4 2v11h12V9H6z"></path>
      </symbol>
      <symbol id="i-career" viewBox="0 0 24 24">
        <path d="M9 4h6l1 3h5v13H3V7h5l1-3zm1.5 3h3l-.3-1h-2.4l-.3 1zM5 10v8h14v-8H5z"></path>
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path d="M6 3h12v3h3v3a5 5 0 0 1-5 5h-.2A6 6 0 0 1 13 16.9V20h4v2H7v-2h4v-3.1A6 6 0 0 1 8.2 14H8a5 5 0 0 1-5-5V6h3V3zm12 5v3a3 3 0 0 0 1-2.2V8h-1zM5 8v.8A3 3 0 0 0 6 11V8H5zm3-3v6a4 4 0 0 0 8 0V5H8z"></path>
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M12 3l9 8h-3v10h-5v-6h-2v6H6V11H3l9-8z"></path>
      </symbol>
    </svg>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand-block">
          <div class="brand-mark">L</div>
          <div>
            <div class="brand-title">人生挂机</div>
            <div class="brand-subtitle">Life Idle</div>
          </div>
        </div>
        <nav class="nav-list" id="navList"></nav>
        <section class="sidebar-section">
          <div class="sidebar-section-title">技能等级</div>
          <div class="sidebar-skill-list" id="sidebarSkillList"></div>
        </section>
        <div class="sidebar-footer">
          <button class="icon-button ghost" id="saveBtn" type="button" title="保存进度">
            <svg><use href="#i-save"></use></svg><span>保存</span>
          </button>
          <button class="icon-button danger" id="resetBtn" type="button" title="重开一局">
            <svg><use href="#i-reset"></use></svg><span>重开</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="hero-status">
            <div class="avatar-wrap">
              <img src="./light_priestess_idle_92x88_preview.png" alt="角色头像" />
            </div>
            <div>
              <div class="eyebrow" id="stageLabel">少年期</div>
              <h1>人生挂机游戏</h1>
              <div class="meta-line" id="metaLine"></div>
            </div>
          </div>
          <div class="top-resource-bar" id="topResourceBar"></div>
        </header>

        <section class="notice-row" id="noticeRow"></section>

        <section class="view active" id="view-home" aria-labelledby="tab-home">
          <div class="home-grid melvor-layout">
            <div class="main-column">
              <section class="panel activity-panel">
                <div class="panel-heading">
                  <h2>当前挂机</h2>
                  <span id="sceneBadge" class="badge"></span>
                </div>
                <div class="training-panel" id="trainingPanel"></div>
              </section>

              <section class="panel">
                <div class="panel-heading">
                  <h2>状态</h2>
                </div>
                <div class="stat-grid" id="vitalsGrid"></div>
              </section>
            </div>

            <aside class="right-column">
              <section class="panel">
                <div class="panel-heading">
                  <h2>资源</h2>
                </div>
                <div class="resource-grid" id="resourceGrid"></div>
              </section>

              <section class="panel">
                <div class="panel-heading">
                  <h2>待处理事件</h2>
                  <span class="badge" id="eventCountBadge"></span>
                </div>
                <div id="homeEventBox" class="event-focus"></div>
              </section>

              <section class="panel">
                <div class="panel-heading">
                  <h2>成长记录</h2>
                </div>
                <div class="log-list" id="logList"></div>
              </section>
            </aside>
          </div>
        </section>

        <section class="view" id="view-skills" aria-labelledby="tab-skills">
          <section class="panel">
            <div class="panel-heading">
              <h2>技能树</h2>
              <div class="segmented" id="skillFilters"></div>
            </div>
            <div class="skill-grid" id="skillGrid"></div>
          </section>
        </section>

        <section class="view" id="view-events" aria-labelledby="tab-events">
          <div class="two-column">
            <section class="panel">
              <div class="panel-heading">
                <h2>当前事件</h2>
              </div>
              <div id="eventPanel"></div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <h2>事件历史</h2>
              </div>
              <div class="history-list" id="eventHistory"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-social" aria-labelledby="tab-social">
          <div class="social-layout">
            <section class="panel">
              <div class="panel-heading">
                <h2>社交场景</h2>
                <span class="badge soft" id="socialStageBadge"></span>
              </div>
              <div class="social-scene-list" id="socialSceneList"></div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <h2>NPC</h2>
                <span class="badge" id="socialSceneBadge"></span>
              </div>
              <div class="social-npc-grid" id="socialNpcGrid"></div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <h2>社交详情</h2>
                <span class="badge soft" id="socialNpcBadge"></span>
              </div>
              <div id="socialDetail"></div>
            </section>
          </div>
        </section>

        <section class="view" id="view-inventory" aria-labelledby="tab-inventory">
          <section class="panel">
            <div class="panel-heading">
              <h2>背包</h2>
              <span class="badge soft" id="inventoryBadge"></span>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
          </section>
        </section>

        <section class="view" id="view-career" aria-labelledby="tab-career">
          <section class="panel">
            <div class="panel-heading">
              <h2>职业</h2>
              <span class="badge" id="currentCareerBadge"></span>
            </div>
            <div class="career-grid" id="careerGrid"></div>
          </section>
        </section>

        <section class="view" id="view-achievements" aria-labelledby="tab-achievements">
          <section class="panel">
            <div class="panel-heading">
              <h2>成就</h2>
              <span class="badge soft" id="achievementBadge"></span>
            </div>
            <div class="achievement-grid" id="achievementGrid"></div>
          </section>
        </section>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite" aria-atomic="false"></div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="panel-heading">
          <h2 id="modalTitle">离线结算</h2>
          <button class="small-button" id="modalCloseBtn" type="button">关闭</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>
  </body>
</html>
